<main class="game">
  <h1>Tic Tac Toe</h1>

  <p class="status">
    @if (winner(); as w) {
      Player <strong class="mark" [class]="w">{{ w }}</strong> wins!
    } @else if (isDraw()) {
      It's a draw!
    } @else {
      Player <strong class="mark" [class]="current()">{{ current() }}</strong>'s turn
    }
  </p>

  <app-tic-tac-toe-board [cells]="board()" [winLine]="winLine()" [disabled]="!!winner()" (play)="play($event)" />

  <button class="reset" (click)="reset()">New game</button>

  <div class="score">
    <span>X: {{ score().X }}</span>
    <span>O: {{ score().O }}</span>
    <span>Draws: {{ score().draw }}</span>
  </div>
</main>
